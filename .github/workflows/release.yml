name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches all version sources
        run: |
          # manifest.json's version is stamped from package.json at build time
          # (scripts/build-mcpb.mjs), so package.json is the single source of truth.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          MISMATCH=""
          for name_ver in "package.json=$PKG_VERSION" "package-lock.json=$LOCK_VERSION"; do
            ver="${name_ver#*=}"
            if [ "$TAG_VERSION" != "$ver" ]; then
              MISMATCH="$MISMATCH $name_ver"
            fi
          done
          if [ -n "$MISMATCH" ]; then
            echo "::error::version mismatch: tag=v$TAG_VERSION$MISMATCH"
            exit 1
          fi
          echo "version ok: $TAG_VERSION"

      - run: npm ci

      - name: Build MCPB bundle
        run: npm run build:mcpb

      - name: Generate checksums
        working-directory: build
        run: sha256sum *.mcpb > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/*.mcpb

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>&1)"
          RELEASE_STATUS=$?
          set -e
          if [ $RELEASE_STATUS -eq 0 ]; then
            if [ "$(echo "$RELEASE_JSON" | jq -r .isDraft)" = "true" ]; then
              echo "Draft release already exists — deleting stale draft before re-creating"
              gh release delete "$GITHUB_REF_NAME" --yes
            fi
          elif echo "$RELEASE_JSON" | grep -qi "release not found"; then
            echo "No existing release for $GITHUB_REF_NAME"
          else
            echo "::error::failed to check for an existing release: $RELEASE_JSON"
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          インストール手順は [README](https://github.com/rakus-lc/blastengine-mcp#インストールmcpb--claude-desktop-向け推奨) を参照してください。

          ## 成果物の検証（任意）

          - チェックサム: `sha256sum -c SHA256SUMS`
          - ビルド来歴: `gh attestation verify blastengine-mcp-server-*.mcpb --repo rakus-lc/blastengine-mcp`
          EOF
          gh release create "$GITHUB_REF_NAME" build/*.mcpb build/SHA256SUMS \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes
